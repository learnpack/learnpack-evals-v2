# The API service, declared (Render Blueprints).
#
# Applying this file creates the service and asks once for the values it deliberately does not
# carry. It is one step of a longer job whose order cannot be improvised:
# `backend/ENVIRONMENT.md` is that job, and this file is its second step.
#
# The frontend is not here. It is a Netlify site (`netlify.toml`), and a blueprint that
# declared half of an environment would read as if it declared all of it.

services:
  - name: learnpack-evals-api
    type: web
    runtime: docker
    # Paid rather than free for one reason: `preDeployCommand` needs a paid instance, and
    # migrating before traffic switches is not optional here (see below).
    plan: starter
    # Match the region of the Neon project. One request pays this round trip many times over
    # — a batch pays it thousands — while a browser pays it once.
    region: virginia
    # Everything below is relative to it, the Docker build context included. That is what the
    # Dockerfile assumes: it copies `pyproject.toml` and `uv.lock` from the context root.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # `/health` runs a `SELECT 1`, so a service that cannot reach its database reads as down
    # instead of as up-and-failing-every-request.
    healthCheckPath: /health
    # The schema moves with the code: once per deploy, after the build and before traffic
    # switches. A failure here aborts the deploy and leaves the previous version serving,
    # which is the whole reason it is not in the start command — and it closes the window
    # `app/platform/schema_version.py` can only warn about (it refuses on a dev box and warns
    # here, precisely because a deploy may start a process mid-migration).
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      # Declared rather than left to the code's default, so that the refusal is never what
      # discovers it: `local` here does not boot at all (ADR-0008), and a variable nobody
      # wrote down is a variable somebody can set by hand.
      - key: AUTH_MODE
        value: clerk
      # Asked for once, when the Blueprint is applied. Neon, with the `postgresql+psycopg://`
      # prefix and `?sslmode=require`.
      - key: DATABASE_URL
        sync: false
      # `CLERK_JWKS_URL` is deliberately absent: left empty it is derived from the issuer, and
      # a value copied over from a local `.env` silently wins over the issuer and points this
      # instance at a development one.
      - key: CLERK_ISSUER
        sync: false
      # Without it an invitation is recorded here and never created in Clerk, so the person
      # invited cannot sign in to an invite-only instance at all (ADR-0049).
      - key: CLERK_SECRET_KEY
        sync: false
      # Provisioning, not authorization, and only for whoever arrives uninvited: it decides
      # the role a NEW assessor is created with and never changes an existing one (ADR-0007).
      - key: ADMIN_EMAILS
        sync: false
      # The Netlify origin. Its FIRST entry is where Clerk's invitation link lands, so the
      # production frontend goes first — see `Settings.invitation_redirect_url`.
      - key: ALLOWED_ORIGINS
        sync: false
      # What is NOT here, and why:
      #
      # - `LLM_API_KEY`: no assessor judges from this instance. Measuring a generator runs on
      #   a developer's machine, and a key on a host that has no use for it is a key that can
      #   leak for nothing (ADR-0034 makes it access, never identity).
      # - `BREATHECODE_*` / `RIGOBOT_*`: the seat infrastructure of ADR-0061 is created once
      #   by hand and may not exist. Unset is a valid deployment — every screen works and the
      #   course simply loads without its AI, saying so.
      # - `LOCAL_SOURCE_ROOTS`: local trees are served only under `AUTH_MODE=local`, and a
      #   locator into this host would point at bytes it does not serve.
