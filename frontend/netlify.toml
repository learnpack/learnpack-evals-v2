# The console, built and served by Netlify (08-code.md §10).
#
# In `frontend/`, and the CLI runs here too — `task deploy:console` does. The two have to be
# the same directory, and not because of config lookup: the Next.js runtime writes what it
# builds under `.netlify/` next to the build, and `netlify deploy` then reads the bundled edge
# functions from `.netlify/edge-functions-dist` under the directory the CLI was RUN from.
# With this file at the repository root and `base = "frontend"`, the two differ and the edge
# functions are dropped from the deploy without a word — and the Clerk middleware is one, so
# every page served without it, to anyone.
#
# The build runs on a developer's machine because Netlify does not build this repository.
# The CLI reads this file the same way a hosted build would, so what is declared here is what
# publishes either way.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The version CI builds with. Left to Netlify's default, the two could drift apart and the
  # build that breaks would be the one nobody ran locally.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The environment is set in the Netlify dashboard, never here — `NEXT_PUBLIC_*` values are
# inlined at BUILD time, so changing one needs a redeploy and not just a restart:
#   NEXT_PUBLIC_API_URL · NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY · CLERK_SECRET_KEY
#   NEXT_PUBLIC_CLERK_JWT_TEMPLATE · NEXT_PUBLIC_CLERK_SIGN_UP_URL=/accept-invitation
# And this origin has to be the first entry of the API's ALLOWED_ORIGINS: it is what CORS
# allows, and what Clerk's invitation link is derived from. See backend/ENVIRONMENT.md.
