[project]
name = "learnpack-evals-backend"
version = "0.1.0"
description = "Pedagogical quality evaluation of AI-generated educational content — MVP backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
follow_imports = "silent"
# Scope estricto: fundamentos que los módulos nuevos importan. Cada módulo nuevo
# de app/modules/ se AGREGA a esta lista al crearse (docs/design/13-code-qa.md §8).
# El legacy (app/modules/* del slice 1, main, cli, config) queda fuera: deliberado.
files = [
    "app/shared",
    "app/platform/db.py",
    "app/platform/uow.py",
    "app/platform/events.py",
    "app/modules/evaluand_registry",
    "app/modules/evaluation_design",
    "app/modules/content_profiling",
    "app/modules/evaluation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
