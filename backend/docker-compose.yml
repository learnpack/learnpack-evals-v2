# Local Postgres. Two databases, deliberately in two containers:
#
#   db      (15433) — the test suite.
#   db-dev  (15434) — local development (AUTH_MODE=local, ADR-0008). Separate because the
#                     suite's `cleanup` fixture deletes rows, which would eat your demo data.
#
# The ports are far from Postgres's own. 5432 is its default and 5433 is what the Windows
# installer hands the SECOND instance it finds — it scans upward — so a machine with two
# Postgres versions shadows a container published there, and `localhost` reaches the native
# server instead. It presents as `password authentication failed`, never as a refused
# connection, because something DID answer. `conftest.py` says so when it happens.
# 15433/15434 are below the ephemeral range (49152+ on Windows, so a published port there
# can lose a race with an outbound socket) and outside anything an installer picks.
#
# Neon stays the production store — migrations, deploy and the final smoke check run there.
services:
  db:
    image: postgres:17-alpine
    container_name: learnpack-evals-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnpack_evals_test
    ports:
      - "15433:5432"
    healthcheck:
      # `-h 127.0.0.1` and not the default socket: during initdb the entrypoint runs a
      # TEMPORARY server that listens on the Unix socket only, and a socket probe calls it
      # ready. `up -d --wait` then returns, the temporary server shuts down, and whatever
      # connected over TCP in that window gets "server closed the connection unexpectedly".
      # Over TCP the probe fails until the real server is listening, which is the fact
      # anything outside the container actually needs.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d learnpack_evals_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  db-dev:
    image: postgres:17-alpine
    container_name: learnpack-evals-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnpack_evals_dev
    ports:
      - "15434:5432"
    volumes:
      # Unlike the test database, this one keeps its data between restarts.
      - learnpack-evals-dev-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, for the reason given above. This one is where it bit: the dev database
      # keeps a volume, so it only runs initdb after `db:reset` destroys it — which is
      # exactly when `db:reset` goes on to migrate.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d learnpack_evals_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  learnpack-evals-dev-data:
