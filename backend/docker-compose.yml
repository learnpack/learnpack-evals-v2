# Local Postgres for the test suite only.
#
# The suite is latency-bound, not CPU-bound: against Neon (us-east-1) every query costs
# ~150 ms of round trip, which dominates everything. Locally it is ~0.3 ms.
# Neon stays the real store — migrations, deploy and the final smoke check run there.
services:
  db:
    image: postgres:17-alpine
    container_name: learnpack-evals-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnpack_evals_test
    # 5433 on the host, so it never clashes with a local Postgres on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnpack_evals_test"]
      interval: 2s
      timeout: 3s
      retries: 15
