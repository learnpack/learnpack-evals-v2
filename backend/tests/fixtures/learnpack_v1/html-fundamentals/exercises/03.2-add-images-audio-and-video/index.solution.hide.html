<!DOCTYPE html>
<html>
<head>
    <title>Media Challenge</title>
</head>
<body>
    <h1>My Media Page</h1>
    
    <h2>Images</h2>
    <p>Here are three beautiful images from nature and architecture.</p>
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Mountain landscape with lake">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png" alt="Transparent PNG example image">
    <img src="https://images.pexels.com/photos/414171/pexels-photo-414171.jpeg" alt="City skyline at sunset">

    <h2>Audio</h2>

    <audio controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">

    </audio>

    <h2>Video</h2>

    <video controls width="400">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</body>
</html>
