version: '3'

tasks:
  setup:env:
    desc: Copy local env templates when missing
    cmds:
      - task: setup:env:backend
      - task: setup:env:frontend

  setup:env:backend:
    internal: true
    dir: backend
    cmds:
      - test -f .env || cp .env.example .env

  setup:env:frontend:
    internal: true
    dir: frontend
    cmds:
      - test -f .env.local || cp .env.local.example .env.local

  setup:deps:
    desc: Install backend and frontend dependencies
    cmds:
      - task: setup:deps:backend
      - task: setup:deps:frontend

  setup:deps:backend:
    internal: true
    dir: backend
    cmds:
      - uv sync

  setup:deps:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm install

  setup:migrate:
    desc: Run Alembic migrations
    dir: backend
    cmds:
      - uv run alembic upgrade head

  setup:seed:
    desc: Load rubric and reference data, then build the workbench (ADR-0045)
    dir: backend
    cmds:
      - uv run python -m app.cli seed
      - uv run python -m app.cli seed-workbench

  setup:
    desc: One-time local setup (env, deps, DB, migrate, seed)
    cmds:
      - task: setup:env
      - task: setup:deps
      - task: db
      - task: db:wait
      - task: setup:migrate
      - task: setup:seed

  db:
    desc: Start local Postgres containers (test + dev)
    dir: backend
    cmds:
      - docker compose up -d

  db:wait:
    desc: Wait until Postgres healthchecks pass
    dir: backend
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Stop local Postgres containers (keeps db-dev volume)
    dir: backend
    cmds:
      - docker compose down

  db:reset:
    desc: DESTROY the local database and rebuild it from zero (volume, migrations, workbench)
    prompt: This deletes every local course, study, judgment and profile. Continue?
    cmds:
      # The volume, not a list of tables to truncate: a wipe that enumerates what to delete
      # is a wipe that forgets the table added last week. Nothing here is a source of truth —
      # the courses live in the generator's own tree and everything else is rebuilt below.
      - task: db:destroy
      - task: db
      - task: db:wait
      - task: setup:migrate
      - task: setup:seed

  db:destroy:
    internal: true
    dir: backend
    cmds:
      - docker compose down -v

  seed:demo:
    desc: Add the human-MVP demo (evaluators, two frozen courses, an open campaign)
    dir: backend
    cmds:
      - uv run python -m app.cli seed-demo

  backend:
    desc: Run FastAPI dev server (http://localhost:8000)
    dir: backend
    cmds:
      - uv run uvicorn app.main:app --reload

  frontend:
    desc: Run Next.js dev server (http://localhost:3000)
    dir: frontend
    cmds:
      - npm run dev

  servers:
    desc: Run backend and frontend in parallel (blocks until stopped)
    deps:
      - backend
      - frontend

  dev:
    desc: Start DB and dev servers (daily workflow)
    cmds:
      - task: db
      - task: db:wait
      - task: servers

  # --- Releasing ------------------------------------------------------------
  # A deploy is an act somebody performs, not a consequence of pushing. Neither host builds
  # from this repository — it is private and owned by an organisation whose GitHub Apps we
  # cannot install — so the code is published from here: an image to a registry for the API,
  # a built site to Netlify for the console. Both read `backend/.env.instance`.
  #
  # Neither of these touches the database. That is `instance:*`, below.

  deploy:api:
    desc: Build, publish and release the API image
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      - |
        if [ -z "$IMAGE_REPO" ]; then
          echo "IMAGE_REPO is empty: backend/.env.instance is where it is declared." >&2
          exit 1
        fi
        # An image tagged with a commit is a claim about what is inside it. Uncommitted work
        # would make that claim false, and the tag outlives the chance to notice. Untracked
        # files do not count: `.dockerignore` keeps them out of the context anyway.
        if [ -n "$(git status --porcelain -uno)" ]; then
          echo "There are uncommitted changes: the image would be tagged with a commit that" >&2
          echo "does not describe it. Commit or stash first." >&2
          exit 1
        fi
        tag=$(git rev-parse --short HEAD)
        # Render runs amd64; an Apple-silicon machine would otherwise publish arm64 and the
        # service would fail to start with an error about the platform, not about the build.
        docker build --platform linux/amd64 -t "$IMAGE_REPO:$tag" -t "$IMAGE_REPO:latest" .
        docker push "$IMAGE_REPO:$tag"
        docker push "$IMAGE_REPO:latest"
        echo "published $IMAGE_REPO:$tag"
      - |
        # Pushing an image does not release it: an image-backed service does not redeploy on
        # its own, which is the property this whole approach is built on. This is the release.
        if [ -z "$RENDER_DEPLOY_HOOK" ]; then
          echo "No RENDER_DEPLOY_HOOK set — release it from the dashboard: Manual Deploy." >&2
        else
          curl -fsS "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "release triggered; the pre-deploy command migrates before traffic switches"
        fi

  deploy:console:
    desc: Build and publish the console to Netlify, live
    dir: frontend
    cmds:
      # From `frontend/`, where `netlify.toml` is, and the build directory has to be the one
      # the CLI is run from: `netlify deploy` reads the bundled edge functions from
      # `.netlify/edge-functions-dist` under its OWN working directory, while the Next.js
      # runtime writes them next to the build. Run from the root with a `base` pointing here,
      # the two differ and the edge functions — the Clerk middleware among them — are left
      # out of the deploy without a word, and every page is served to anyone.
      #
      # `--build` runs the build here, and Netlify's CLI pulls the site's own environment down
      # for it — which is what keeps the NEXT_PUBLIC_* values (inlined at build time) the same
      # ones the dashboard declares.
      - netlify deploy --build --prod

  deploy:console:preview:
    desc: Same, to a draft URL — look at it before promoting
    dir: frontend
    cmds:
      - netlify deploy --build

  # --- The deployed instance ------------------------------------------------
  # These run the ordinary CLI against the DEPLOYED store, from this machine, because nothing
  # else can: the image is built from `backend/` alone, so `docs/seed/` is not in it and the
  # seeder cannot run over there. They chain commands that already exist and invent no act —
  # replaying human acts is what `seed-workbench` does, and it stays on a dev box (ADR-0045).
  #
  # Every one of them reads `backend/.env.instance` (gitignored, see its `.example`) and
  # refuses until CONFIRM names the host it is about to write to. They live beside `db:reset`
  # in one file, and the two must never be confused for one another.
  #
  # The order they are run in is `backend/ENVIRONMENT.md`. This is not that order.

  instance:guard:
    internal: true
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      - |
        host=$(printf '%s' "$DATABASE_URL" | sed -e 's|.*@||' -e 's|[:/?].*||')
        if [ -z "$host" ]; then
          echo "DATABASE_URL is empty: backend/.env.instance is where these tasks read it." >&2
          exit 1
        fi
        echo "This writes to $host, as ${ADMIN_EMAIL:-nobody} (AUTH_MODE=${AUTH_MODE:-unset})."
        if [ "$CONFIRM" != "$host" ]; then
          echo "Re-run with CONFIRM=$host to say that is the store you meant." >&2
          exit 1
        fi

  instance:clerk-template:
    desc: Write the JWT template on the Clerk instance CLERK_SECRET_KEY names — before anyone signs in
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      # No guard, because this writes to no store: the act belongs to the Clerk instance that
      # key names, and the command refuses on its own when there is no key. What it needs from
      # here is only that the key comes from `.env.instance` rather than from the local `.env`,
      # which is what a developer rehearsing against their own machine has in it.
      - uv run python -m app.cli setup-clerk-jwt-template

  instance:promote-admin:
    desc: Break-glass — make ADMIN_EMAIL an admin when they were born an evaluator
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      - task: instance:guard
      # For the one case ENVIRONMENT.md names: the JWT template was written late, so the first
      # admin was created without an `email` claim and the allowlist — which applies once, at
      # row creation — cannot rescue them. There is no admin yet, so nobody could grant the
      # role from the console, which is what makes a command without the console's guardrails
      # the right tool here and the wrong one everywhere else.
      - uv run python -m app.cli set-role --email $ADMIN_EMAIL --role admin

  instance:seed:
    desc: Seed a deployed store — rubric, reference data, accepted extractions (re-runnable)
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      - task: instance:guard
      # What nothing in the app can author: the human reference instrument a campaign pins
      # when it opens (ADR-0056) and the reference data an instrument cites.
      - uv run python -m app.cli seed
      # The data-requirements namespace, which nothing else here mints: a profile names what
      # it extracted by ids that Evaluation Design has to have declared first (ADR-0014), and
      # they are declared by importing an instrument. On a dev box `seed-workbench` imports
      # these two; a campaign store has no workbench, so they are imported here — as drafts,
      # never published, since no assessor judges from a deployed store. Between them they
      # declare every id the two adapters extract: the first covers LearnpackV1 and most of
      # LearnpackV2, the second the three ids only LearnpackV2 declares (assessment_offerings,
      # declared_objectives, lesson_concept_coverage). Missing either, every automatic profile
      # of that format aborts with "capabilities outside the data_requirements namespace" and
      # the course stays unread.
      - uv run python -m app.cli import-instrument --file ../docs/seed/instruments/learnpack-course-qa-v1.yaml
      - uv run python -m app.cli import-instrument --file ../docs/seed/instruments/course-drafts-qa-v10.yaml
      # And what arms automatic profiling (ADR-0029). Without it every course registers
      # unread, and an item is withheld from a human only where a profile settles that its
      # datum is undeclared (ADR-0053) — so the four items a V1 course cannot answer would be
      # asked of every expert, with nothing raised anywhere.
      - uv run python -m app.cli accept-extraction --package-format LearnpackV1 --email $ADMIN_EMAIL
      - uv run python -m app.cli accept-extraction --package-format LearnpackV2 --email $ADMIN_EMAIL

  instance:reprofile:
    desc: Profile every course of FORMAT that has no ok profile yet (FORMAT=LearnpackV1|LearnpackV2)
    dir: backend
    dotenv: ['.env.instance']
    requires:
      vars: [FORMAT]
    cmds:
      - task: instance:guard
      # For courses registered while profiling could not run — before `instance:seed`, or
      # with the local API down for a V2 tree. Contents already profiled ok are skipped, so
      # it is safe to run over everything. A V2 tree still needs `task backend` serving it.
      - uv run python -m app.cli reprofile --package-format {{.FORMAT}}

  instance:generator:
    desc: Mint the generator lineage GENERATOR_NAME — once ever, and it refuses a second time
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      - task: instance:guard
      # Its own target, and not part of `instance:seed`, because it is the one act here that
      # is NOT idempotent and must not be: a lineage still takes a typed name, so naming one
      # twice is a typo worth refusing rather than a repetition worth absorbing (ADR-0031).
      # Chained into a re-runnable target it would fail every re-run for being right.
      - uv run python -m app.cli register-generator --name $GENERATOR_NAME

  instance:courses:v1:
    desc: Register the LearnpackV1 courses of COURSES_V1_CSV (a spreadsheet of URLs)
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      - task: instance:guard
      # Public locators, so this store can read these packages again by itself.
      #
      # `--register-new-version`, because on a fresh store the version does not exist yet and
      # without the flag the whole list is refused. The flag exists to stop a typo attributing
      # a batch to a phantom version; here the version is declared once in `.env.instance`,
      # reviewed there rather than typed per run, which is the guard the flag asks for.
      - >
        uv run python -m app.cli register-package --from-csv $COURSES_V1_CSV
        --generator-name $GENERATOR_NAME --generator-version $GENERATOR_VERSION_V1
        --register-new-version

  instance:courses:v2:
    desc: Register the LearnpackV2 courses of the V2_ROOT tree (needs the local API running)
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      - task: instance:guard
      # Two processes, and both are needed: the LOCAL API serves the tree (`task backend`, in
      # local mode), and THIS command fetches through that mount and writes to the deployed
      # store. The registered locators therefore point at localhost, which is fine for a
      # campaign — the evaluator's screen reads the profile that was stored here and never
      # fetches — and means only that the deployed API cannot re-read these packages later.
      - uv run python -m app.cli register-package --all --root $V2_ROOT --format LearnpackV2

  instance:deployments:
    desc: Point registered courses at where they are deployed (DEPLOYMENTS_CSV; FORMAT defaults to LearnpackV2)
    dir: backend
    dotenv: ['.env.instance']
    vars:
      FORMAT: '{{.FORMAT | default "LearnpackV2"}}'
    cmds:
      - task: instance:guard
      # Until this, a course can be judged automatically but the assign picker refuses it, so
      # it can never be handed to an expert (ADR-0028).
      #
      # An external_id is namespaced by its format (ADR-0005), and the command's own default
      # is LearnpackV1 — under which every V2 slug is "not found". V2 is the default here
      # because a V1 course registered from a URL already carries that URL as its deployment
      # (ADR-0028); this act is for the courses read off disk. FORMAT=LearnpackV1 for the rare
      # V1 course deployed somewhere other than where it was registered from.
      - uv run python -m app.cli declare-deployment --from-csv $DEPLOYMENTS_CSV --email $ADMIN_EMAIL --format {{.FORMAT}}

  instance:dump:
    desc: Back up the deployed store to DUMP_DIR — before every release while a campaign is open
    dir: backend
    dotenv: ['.env.instance']
    cmds:
      - task: instance:guard
      # `pg_dump` speaks libpq, which does not know the SQLAlchemy driver prefix, so it is
      # stripped. The result is the identified record of what the panel answered: it holds
      # every SME's address and belongs outside the repository, which DUMP_DIR is for.
      #
      # Run from the image the local database uses rather than from a pg_dump on PATH: a
      # developer's machine usually has none, or one older than the server — and pg_dump
      # refuses a server newer than itself — while the image is the server's own major and is
      # already pulled here. The dump streams through stdout instead of a mounted volume, so
      # no host path crosses into the container.
      - |
        mkdir -p "$DUMP_DIR"
        out="$DUMP_DIR/$(date -u +%Y%m%dT%H%M%SZ).dump"
        docker run --rm postgres:17-alpine pg_dump --format=custom --no-owner --no-privileges \
          "$(printf '%s' "$DATABASE_URL" | sed 's|^postgresql+psycopg://|postgresql://|')" > "$out"
        echo "wrote $out ($(wc -c < "$out") bytes)"
